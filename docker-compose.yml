services:
  app:
    build: .
    container_name: yummy_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://yummy_user:yummy_password@db:5432/yummy_db
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: yummy_postgres
    environment:
      POSTGRES_DB: yummy_db
      POSTGRES_USER: yummy_user
      POSTGRES_PASSWORD: yummy_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: yummy_redis
    ports:
      - "6380:6379"

volumes:
  postgres_data:
