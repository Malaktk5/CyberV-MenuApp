version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: yummy_postgres
    environment:
      POSTGRES_DB: yummy_db
      POSTGRES_USER: yummy_user
      POSTGRES_PASSWORD: yummy_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: yummy_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
