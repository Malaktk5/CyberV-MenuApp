<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion · Yummy</title>

    <link rel="stylesheet" href="/assets/css/base.css?v=9">
    <link rel="stylesheet" href="/assets/css/public.css?v=9">
    <style>
        body.login-page {
            min-height: 100vh;
            padding-top: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: radial-gradient(circle at top right, #f3e6dc 0%, #faf7f2 55%);
        }
        .login-card {
            width: min(430px, 92vw);
            margin: 2rem auto;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: #fff;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }
        .login-card-top {
            padding: 2rem 2rem 1.75rem;
            background: #181512;
            color: #fff;
            text-align: center;
        }
        .login-card-top img {
            height: 46px;
            padding: 5px 12px;
            border-radius: 10px;
            background: #fff;
            margin: 0 auto 0.9rem;
            display: block;
        }
        .login-card-top h2 {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.55rem;
            font-weight: 800;
            color: #fff;
        }
        .login-card-top p {
            margin: 0.35rem 0 0;
            color: #bdb3a8;
            font-size: 0.88rem;
        }
        .login-card-body {
            padding: 1.85rem 2rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .login-field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--ink);
        }
        .login-card-body button {
            margin-top: 0.4rem;
            padding: 0.85rem;
            border-radius: 12px;
            font-size: 0.98rem;
        }
    </style>
</head>

<body class="login-page">
    <header class="top">
        <a href="/"><img class="logo" src="/assets/img/logo.png" alt="Yummy"></a>
        <nav><a class="staff" href="/">← Retour au menu</a></nav>
    </header>

    <form class="login-card" id="f">
        <div class="login-card-top">
            <img src="/assets/img/logo.png" alt="Yummy">
            <h2>Espace Personnel</h2>
            <p>Connectez-vous pour accéder à votre poste</p>
        </div>

        <div class="login-card-body">
            <label class="login-field">
                Adresse email
                <input
                    name="email"
                    type="email"
                    placeholder="ex. gerant@yummy.dz"
                    required
                    autocomplete="username"
                >
            </label>

            <label class="login-field">
                Mot de passe
                <input
                    name="mot_de_passe"
                    type="password"
                    placeholder="••••••••"
                    required
                    autocomplete="current-password"
                >
            </label>

            <p class="err" id="err" style="margin:0;text-align:center;"></p>
            <button type="submit">Se connecter</button>
        </div>
    </form>

    <script type="module" src="/assets/js/admin/login.js?v=9"></script>
</body>
</html>
